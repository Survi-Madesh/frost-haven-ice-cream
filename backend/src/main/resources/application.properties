
spring.application.name=frost-haven

# If external MySQL DB environment variables are provided, use them; otherwise fallback to H2 embedded database
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/frosthavendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

server.port=${PORT:8080}
